spring:
  application:
    name: book-store
  datasource:
    url: "jdbc:hsqldb:file:./data/book-store;shutdown=true;hsqldb.write_delay=false"
    username: sa
  jpa:
    open-in-view: false
    defer-datasource-initialization: true
    hibernate:
      ddl-auto: update
  sql:
    init:
      mode: always

server:
  port: 8080
  servlet:
    context-path: "/api"

logging:
  pattern:
    level: "%5p [%X{requestId:-}]"

management:
  endpoints:
    web:
      base-path: "/"
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
