spring:
  application:
    name: book-store
  datasource:
    url: "jdbc:hsqldb:file:./data/book-store;shutdown=true;hsqldb.write_delay=false"
    username: sa
  jpa:
    open-in-view: false
    defer-datasource-initialization: true
    hibernate:
      ddl-auto: update
  sql:
    init:
      mode: always
  rabbitmq:
    host: "${RABBITMQ_HOST:localhost}"
    # see [DEC:publisher-confirms]
    publisher-confirm-type: correlated

book-stock:
  base-url: "${BOOK_STOCK_URL:http://localhost:8081/api}"

server:
  port: 8080
  servlet:
    context-path: "/api"

logging:
  pattern:
    level: "%5p [%X{requestId:-}]"

management:
  endpoints:
    web:
      base-path: "/"
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
  # Production and PR previews have no broker yet: the rabbit indicator would turn /health DOWN
  # and fail the post-deploy smoke test. A broker outage shows up as BBE-19 on a purchase instead.
  health:
    rabbit:
      enabled: false
