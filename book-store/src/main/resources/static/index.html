<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Book Store</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #f6f3ee;
      --surface: #ffffff;
      --text: #1d1b19;
      --muted: #6f6a63;
      --border: #e6e0d7;
      --accent: #ea580c;
      --accent-soft: #fff1e8;
      --error-bg: #fee2e2;
      --error-text: #991b1b;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #141311;
        --surface: #1e1c19;
        --text: #f2eee7;
        --muted: #a19a90;
        --border: #302c27;
        --accent-soft: rgba(234, 88, 12, .16);
        --error-bg: rgba(220, 38, 38, .18);
        --error-text: #fca5a5;
      }
    }

    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--text); font-family: system-ui, -apple-system, sans-serif; }
    .page { max-width: 1040px; margin: 0 auto; padding: 0 1rem 3rem; }
    h2 { font-size: 1.05rem; margin: 2rem 0 1rem; }

    .topbar { display: flex; justify-content: space-between; align-items: center; gap: 1rem; padding: 1.25rem 0; }
    .brand { display: flex; align-items: center; gap: .6rem; font-size: 1.25rem; font-weight: 800; letter-spacing: -.02em; }
    .logo { width: 16px; height: 22px; border-radius: 2px 5px 5px 2px; background: linear-gradient(160deg, #fb923c, var(--accent)); box-shadow: inset 3px 0 0 rgba(0, 0, 0, .2); }
    .tabs { display: flex; padding: 4px; border: 1px solid var(--border); border-radius: 999px; background: var(--surface); }
    .tabs button { padding: .45rem 1rem; border: none; border-radius: 999px; background: transparent; color: var(--muted); font: inherit; font-weight: 600; cursor: pointer; }
    .tabs button[aria-current="page"] { background: var(--text); color: var(--bg); }

    #error { padding: .75rem 1rem; border-radius: 10px; background: var(--error-bg); color: var(--error-text); white-space: pre-line; }
    #error:empty { display: none; }

    [data-kind] { --kind-from: #3f3f46; --kind-to: #a1a1aa; }
    [data-kind="fantasy"] { --kind-from: #4c1d95; --kind-to: #c084fc; }
    [data-kind="sf"] { --kind-from: #0c4a6e; --kind-to: #38bdf8; }
    [data-kind="thriller"] { --kind-from: #450a0a; --kind-to: #ef4444; }
    [data-format="e-book"] { --format-ratio: .74; }
    [data-format="pocket"] { --format-ratio: .87; }
    [data-format="hardcover"] { --format-ratio: 1; }

    .hero { display: flex; align-items: baseline; gap: .75rem; padding: 2rem; border-radius: 18px; background: linear-gradient(135deg, var(--accent), #f59e0b); color: #fff; }
    .hero-count { font-size: 4rem; font-weight: 800; line-height: 1; }
    .hero-label { font-size: 1.1rem; opacity: .9; }
    .kind-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 1rem; margin: 0; padding: 0; list-style: none; }
    .kind-tile { display: grid; gap: .25rem; padding: 1rem 1.25rem; border-radius: 14px; background: linear-gradient(160deg, var(--kind-to), var(--kind-from)); color: #fff; }
    .kind-count { font-size: 2rem; font-weight: 800; }
    .kind-name { font-size: .8rem; font-weight: 600; text-transform: uppercase; letter-spacing: .08em; opacity: .9; }
    .latest { display: grid; gap: .5rem; margin: 0; padding: 0; list-style: none; }
    .latest li { padding: .8rem 1rem; border: 1px solid var(--border); border-left: 4px solid var(--accent); border-radius: 12px; background: var(--surface); font-family: Georgia, serif; }

    .catalog-layout { display: grid; grid-template-columns: 1fr 300px; gap: 2rem; align-items: start; }
    .shelf { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 1.75rem 1rem; align-items: end; }
    .shelf:empty::before { content: "Le catalogue est vide."; color: var(--muted); }
    .book { display: flex; flex-direction: column; align-items: center; gap: .5rem; }
    .book:hover .book-cover { transform: translateY(-4px) rotate(-1deg); }
    .book.is-new .book-cover { animation: pop .6s ease-out; }
    .book-prices { margin: 0; color: var(--muted); font-size: .75rem; text-align: center; }
    .book-cover {
      position: relative; display: flex; flex-direction: column; gap: .4rem;
      width: calc(100% * var(--format-ratio, 1)); aspect-ratio: 2 / 3; padding: .8rem .8rem .8rem 1rem;
      border-radius: 3px 8px 8px 3px; color: #fff; overflow: hidden;
      background: linear-gradient(160deg, var(--kind-to), var(--kind-from));
      box-shadow: inset 6px 0 0 rgba(0, 0, 0, .2), inset 7px 0 0 rgba(255, 255, 255, .15), 0 12px 20px -10px rgba(0, 0, 0, .55);
      transition: transform .2s ease;
    }
    .book-kind { font-size: .65rem; font-weight: 700; text-transform: uppercase; letter-spacing: .12em; opacity: .8; }
    .book-title { font: 700 1rem/1.2 Georgia, serif; overflow-wrap: anywhere; display: -webkit-box; -webkit-line-clamp: 5; -webkit-box-orient: vertical; overflow: hidden; }
    .book-cover .price-tag { position: absolute; right: .5rem; bottom: .5rem; background: #fff; color: #111; box-shadow: 0 2px 6px rgba(0, 0, 0, .3); }
    @keyframes pop { 0% { transform: scale(.6); opacity: 0; } 70% { transform: scale(1.06); } 100% { transform: scale(1); } }

    .price-tag { display: inline-block; padding: .15rem .55rem; border-radius: 999px; background: var(--text); color: var(--bg); font-size: .8rem; font-weight: 700; font-variant-numeric: tabular-nums; white-space: nowrap; }

    .panel { position: sticky; top: 1rem; display: grid; gap: 1rem; padding: 1.25rem; border: 1px solid var(--border); border-radius: 18px; background: var(--surface); box-shadow: 0 10px 30px -20px rgba(0, 0, 0, .4); }
    .panel h2 { margin: 0; }
    .preview { display: flex; justify-content: center; align-items: flex-end; height: 260px; padding: .75rem; border-radius: 12px; background: var(--bg); }
    .preview .book-cover { width: calc(150px * var(--format-ratio, 1)); }
    fieldset { margin: 0; padding: 0; border: none; }
    legend, .field span { margin-bottom: .4rem; color: var(--muted); font-size: .8rem; font-weight: 600; }
    .field { display: grid; }
    .field input { padding: .6rem .75rem; border: 1px solid var(--border); border-radius: 10px; background: var(--surface); color: var(--text); font: inherit; }
    .field input:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
    .choices { display: flex; gap: .5rem; }
    .choice { flex: 1; display: grid; justify-items: center; align-content: end; gap: .3rem; padding: .55rem .25rem; border: 1px solid var(--border); border-radius: 10px; font-size: .8rem; cursor: pointer; transition: border-color .15s, background .15s; }
    .choice:has(input:checked) { border-color: var(--accent); background: var(--accent-soft); }
    .choice:has(input:focus-visible) { outline: 2px solid var(--accent); outline-offset: 1px; }
    .choice input { position: absolute; opacity: 0; pointer-events: none; }
    .kind-dot { width: 14px; height: 14px; border-radius: 50%; background: linear-gradient(160deg, var(--kind-to), var(--kind-from)); }
    .format-shape { aspect-ratio: 2 / 3; border-radius: 2px 4px 4px 2px; background: linear-gradient(160deg, var(--muted), var(--text)); box-shadow: inset 2px 0 0 rgba(0, 0, 0, .25); }
    .format-shape[data-format="e-book"] { height: 28px; }
    .format-shape[data-format="pocket"] { height: 36px; }
    .format-shape[data-format="hardcover"] { height: 44px; }
    .primary { padding: .8rem; border: none; border-radius: 10px; background: var(--accent); color: #fff; font: inherit; font-weight: 700; cursor: pointer; }
    .primary:hover { filter: brightness(1.08); }

    @media (max-width: 760px) {
      .catalog-layout { grid-template-columns: 1fr; }
      .panel { position: static; order: -1; }
      .hero-count { font-size: 3rem; }
    }
  </style>
</head>
<body>
  <div class="page">
    <header class="topbar">
      <div class="brand"><span class="logo"></span>Book Store</div>
      <nav class="tabs">
        <button type="button" data-page="home">Accueil</button>
        <button type="button" data-page="catalog">Catalogue</button>
      </nav>
    </header>

    <p id="error" role="alert"></p>

    <section id="home" hidden>
      <div class="hero">
        <span id="book-count" class="hero-count"></span>
        <span class="hero-label">livres au catalogue</span>
      </div>
      <h2>Par genre</h2>
      <ul id="kinds" class="kind-grid"></ul>
      <h2>Derniers ajouts</h2>
      <ol id="latest-titles" class="latest"></ol>
    </section>

    <section id="catalog" hidden>
      <div class="catalog-layout">
        <div>
          <h2>Catalogue</h2>
          <div id="books" class="shelf"></div>
        </div>

        <form id="add-book" class="panel">
          <h2>Ajouter un livre</h2>
          <div id="preview" class="preview"></div>
          <label class="field">
            <span>Titre</span>
            <input name="title" placeholder="Dune" required>
          </label>
          <fieldset>
            <legend>Genre</legend>
            <div class="choices">
              <label class="choice"><input type="radio" name="kind" value="fantasy" checked><span class="kind-dot" data-kind="fantasy"></span>fantasy</label>
              <label class="choice"><input type="radio" name="kind" value="sf"><span class="kind-dot" data-kind="sf"></span>sf</label>
              <label class="choice"><input type="radio" name="kind" value="thriller"><span class="kind-dot" data-kind="thriller"></span>thriller</label>
            </div>
          </fieldset>
          <fieldset>
            <legend>Format</legend>
            <div id="format-options" class="choices"></div>
          </fieldset>
          <label class="field">
            <span>Prix du livre (€)</span>
            <input name="price" type="number" min="0" step="0.01" inputmode="decimal" placeholder="12,00" required>
          </label>
          <button type="submit" class="primary">Ajouter au catalogue</button>
        </form>
      </div>
    </section>
  </div>

  <script>
    const ENDPOINTS = { home: "pages/home", catalog: "pages/catalog", addBook: "pages/catalog/books" };
    const euros = new Intl.NumberFormat("fr-FR", { style: "currency", currency: "EUR" });

    function formatCents(cents) {
      return euros.format(cents / 100);
    }

    function centsFromEuros(value) {
      return Math.round(Number(value) * 100);
    }

    function element(tag, className, text) {
      const node = document.createElement(tag);
      if (className) node.className = className;
      if (text !== undefined) node.textContent = text;
      return node;
    }

    async function requestPage(url, options) {
      const response = await fetch(url, options);
      const body = await response.json();
      if (!response.ok) throw body.error;
      return body;
    }

    function showError(error) {
      console.error(error);
      const lines = error?.userMessage
        ? [error.userMessage, error.requestId && `Référence : ${error.requestId}`]
        : ["Le service ne répond pas, réessaie dans quelques instants."];
      document.getElementById("error").textContent = lines.filter(Boolean).join("\n");
    }

    function clearError() {
      document.getElementById("error").textContent = "";
    }

    function kindTile(tile) {
      const tileNode = element("li", "kind-tile");
      tileNode.dataset.kind = tile.kind;
      tileNode.append(element("span", "kind-count", tile.bookCount), element("span", "kind-name", tile.kind));
      return tileNode;
    }

    function renderHome(page) {
      document.getElementById("book-count").textContent = page.bookCount;
      document.getElementById("kinds").replaceChildren(...page.kinds.map(kindTile));
      document.getElementById("latest-titles").replaceChildren(...page.latestTitles.map((title) => element("li", null, title)));
    }

    function bookCover({ title, kind, format, priceLabel }) {
      const cover = element("div", "book-cover");
      cover.dataset.kind = kind;
      cover.dataset.format = format;
      cover.append(element("span", "book-kind", kind), element("span", "book-title", title), element("span", "price-tag", priceLabel));
      return cover;
    }

    function bookCard(book) {
      const card = element("article", "book");
      card.append(
        bookCover({ title: book.title, kind: book.kind, format: book.format, priceLabel: formatCents(book.totalPriceInCents) }),
        element("p", "book-prices", `${formatCents(book.bookPriceInCents)} + ${formatCents(book.formatPriceInCents)} format`),
      );
      return card;
    }

    function renderCatalog(page) {
      document.getElementById("books").replaceChildren(...page.books.map(bookCard));
      renderFormats(page.formats);
    }

    function formatOption(option, index) {
      const radio = element("input");
      Object.assign(radio, { type: "radio", name: "format", value: option.format, required: true });
      radio.defaultChecked = index === 0;
      radio.dataset.priceInCents = option.priceInCents;
      const shape = element("span", "format-shape");
      shape.dataset.format = option.format;
      const label = element("label", "choice");
      label.append(radio, shape, element("span", null, option.format), element("span", "price-tag", `+${formatCents(option.priceInCents)}`));
      return label;
    }

    function renderFormats(formats) {
      document.getElementById("format-options").replaceChildren(...formats.map(formatOption));
      updatePreview();
    }

    function totalPriceLabel(form, selectedFormat) {
      const bookPrice = form.elements.price.value;
      if (!selectedFormat || bookPrice === "") return "—";
      return formatCents(centsFromEuros(bookPrice) + Number(selectedFormat.dataset.priceInCents));
    }

    function updatePreview() {
      const form = document.getElementById("add-book");
      const selectedFormat = form.querySelector("input[name=format]:checked");
      document.getElementById("preview").replaceChildren(bookCover({
        title: form.elements.title.value || "Ton titre ici",
        kind: form.querySelector("input[name=kind]:checked").value,
        format: selectedFormat?.value ?? "hardcover",
        priceLabel: totalPriceLabel(form, selectedFormat),
      }));
    }

    function highlightLastBook() {
      document.querySelector("#books .book:last-child")?.classList.add("is-new");
    }

    const RENDERERS = { home: renderHome, catalog: renderCatalog };

    function pageFromHash() {
      const name = location.hash.slice(1);
      return name in RENDERERS ? name : "home";
    }

    async function showPage(name) {
      clearError();
      document.querySelectorAll("section").forEach((section) => { section.hidden = section.id !== name; });
      document.querySelectorAll(".tabs button").forEach((button) => {
        if (button.dataset.page === name) button.setAttribute("aria-current", "page");
        else button.removeAttribute("aria-current");
      });
      try {
        RENDERERS[name](await requestPage(ENDPOINTS[name]));
      } catch (error) {
        showError(error);
      }
    }

    async function addBook(event) {
      event.preventDefault();
      clearError();
      const form = event.target;
      const fields = Object.fromEntries(new FormData(form));
      const payload = {
        title: fields.title,
        kind: fields.kind,
        format: fields.format,
        bookPriceInCents: centsFromEuros(fields.price),
      };
      try {
        renderCatalog(await requestPage(ENDPOINTS.addBook, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload),
        }));
        highlightLastBook();
        form.reset();
        updatePreview();
      } catch (error) {
        showError(error);
      }
    }

    document.querySelectorAll(".tabs button").forEach((button) => {
      button.addEventListener("click", () => { location.hash = button.dataset.page; });
    });
    document.getElementById("add-book").addEventListener("submit", addBook);
    document.getElementById("add-book").addEventListener("input", updatePreview);
    window.addEventListener("hashchange", () => showPage(pageFromHash()));
    showPage(pageFromHash());
  </script>
</body>
</html>
