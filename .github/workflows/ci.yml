name: Test, build and deploy

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

# Une file d'attente par branche : les runs d'une PR s'annulent entre eux,
# ceux de master s'enchaînent pour ne jamais couper un déploiement.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  SCW_REGION: fr-par
  IMAGE: rg.fr-par.scw.cloud/demo-deploy/springboot
  HEALTH_PATH: /api/health

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Set up Gradle (cache + wrapper validation)
        uses: gradle/actions/setup-gradle@v4

      # Trois couches, de la moins chère à la plus chère.
      - name: Unit tests
        run: ./gradlew :book-store:test

      - name: Build jar
        run: ./gradlew :book-store:bootJar

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: book-store/build/reports/tests

      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: app-jar
          path: book-store/build/libs/app.jar
          retention-days: 1

  create-container:
    needs: build-and-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Download tested jar
        uses: actions/download-artifact@v4
        with:
          name: app-jar
          path: book-store/build/libs

      - name: Login to SCW registry
        uses: docker/login-action@v4
        with:
          registry: rg.${{ env.SCW_REGION }}.scw.cloud
          username: nologin
          password: ${{ secrets.SCW_SECRET_KEY }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest
            type=sha,format=long

      - name: Build image (local)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile
          load: true
          push: false
          tags: app:candidate
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test the image
        run: |
          docker run -d --rm -p 8080:8080 --name candidate app:candidate
          curl --fail --silent --show-error \
            --retry 20 --retry-delay 3 --retry-all-errors \
            "http://localhost:8080${HEALTH_PATH}"
          docker stop candidate

      - name: Push image
        id: build-and-push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile
          provenance: false
          push: true
          labels: ${{ steps.meta.outputs.labels }}
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha

      - name: Summary
        run: |
          {
            echo "### Image pushed"
            echo "- Tags: \`${{ steps.meta.outputs.tags }}\`"
            echo "- Digest: \`${{ steps.build-and-push.outputs.digest }}\`"
          } >> "$GITHUB_STEP_SUMMARY"

  deploy:
    needs: create-container
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Set up Scaleway CLI
        uses: scaleway/action-scw@v0
        with:
          save-config: true
          export-config: true
          access-key: ${{ secrets.SCW_ACCESS_KEY }}
          secret-key: ${{ secrets.SCW_SECRET_KEY }}
          default-project-id: ${{ secrets.SCW_DEFAULT_PROJECT_ID }}
          default-organization-id: ${{ secrets.SCW_DEFAULT_ORGANIZATION_ID }}

      - name: Deploy serverless container
        run: |
          scw container container update ${{ secrets.SCW_CONTAINER_ID }} \
            registry-image=${{ env.IMAGE }}:sha-${{ github.sha }} \
            region=${{ env.SCW_REGION }}
          scw container container deploy ${{ secrets.SCW_CONTAINER_ID }} \
            region=${{ env.SCW_REGION }}

      - name: Smoke test production
        run: |
          DOMAIN=$(scw container container get ${{ secrets.SCW_CONTAINER_ID }} \
            region=${{ env.SCW_REGION }} -o json | jq -r .domain_name)
          curl --fail --silent --show-error \
            --retry 12 --retry-delay 10 --retry-all-errors \
            "https://${DOMAIN}${HEALTH_PATH}"
          echo "Deployed: https://${DOMAIN}${HEALTH_PATH}" >> "$GITHUB_STEP_SUMMARY"
