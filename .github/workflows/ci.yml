name: Test, build and deploy

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  SCW_REGION: fr-par
  IMAGE: rg.fr-par.scw.cloud/book-store/springboot
  HEALTH_PATH: /api/health
  PR_PREVIEW_NAMESPACE: book-store-pr-preview

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Set up Gradle (cache + wrapper validation)
        uses: gradle/actions/setup-gradle@v4

      - name: Lint (ktlint)
        run: ./gradlew ktlintCheck

      - name: Unit tests
        run: ./gradlew :book-store:test

      - name: Build jar
        run: ./gradlew :book-store:bootJar

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: book-store/build/reports/tests

      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: app-jar
          path: book-store/build/libs/app.jar
          retention-days: 1

  integration-test:
    needs: build-and-test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Download tested jar
        uses: actions/download-artifact@v4
        with:
          name: app-jar
          path: book-store/build/libs

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}

      - name: Build image (local)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile
          load: true
          push: false
          labels: ${{ steps.meta.outputs.labels }}
          tags: book-store:candidate
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Start the candidate image
        run: APP_IMAGE=book-store:candidate docker compose up -d

      - name: Integration tests (black box)
        run: ./gradlew :book-store-ti:integrationTest

      - name: Container logs
        if: failure()
        run: docker compose logs --no-color app

      - name: Tear down
        if: always()
        run: docker compose down -v

      - name: Export tested image
        if: (github.event_name == 'push' && github.ref == 'refs/heads/master') || github.event_name == 'pull_request'
        run: docker save book-store:candidate -o "$RUNNER_TEMP/book-store.tar"

      - name: Upload tested image
        if: (github.event_name == 'push' && github.ref == 'refs/heads/master') || github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: app-image
          path: ${{ runner.temp }}/book-store.tar
          retention-days: 1

  push-to-scw-registery:
    needs: integration-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Download tested image
        uses: actions/download-artifact@v4
        with:
          name: app-image
          path: ${{ runner.temp }}

      - name: Load tested image
        run: docker load -i "$RUNNER_TEMP/book-store.tar"

      - name: Login to SCW registry
        uses: docker/login-action@v4
        with:
          registry: rg.${{ env.SCW_REGION }}.scw.cloud
          username: nologin
          password: ${{ secrets.SCW_SECRET_KEY }}

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest
            type=sha,format=long

      - name: Push tested image
        id: push
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          while read -r tag; do
            docker tag book-store:candidate "$tag"
            docker push "$tag"
          done <<< "$TAGS"
          echo "digest=$(docker inspect --format '{{index .RepoDigests 0}}' book-store:candidate)" >> "$GITHUB_OUTPUT"

      - name: Summary
        run: |
          {
            echo "### Image pushed"
            echo "- Tags: \`${{ steps.meta.outputs.tags }}\`"
            echo "- Digest: \`${{ steps.push.outputs.digest }}\`"
          } >> "$GITHUB_STEP_SUMMARY"

  deploy:
    needs: push-to-scw-registery
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 10

    steps:
      - name: Set up Scaleway CLI
        uses: scaleway/action-scw@v0
        with:
          save-config: true
          export-config: true
          access-key: ${{ secrets.SCW_ACCESS_KEY }}
          secret-key: ${{ secrets.SCW_SECRET_KEY }}
          default-project-id: ${{ secrets.SCW_DEFAULT_PROJECT_ID }}
          default-organization-id: ${{ secrets.SCW_DEFAULT_ORGANIZATION_ID }}

      - name: Check database secrets
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DATABASE_USERNAME: ${{ secrets.DATABASE_USERNAME }}
          DATABASE_PASSWORD: ${{ secrets.DATABASE_PASSWORD }}
        run: |
          for name in DATABASE_URL DATABASE_USERNAME DATABASE_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::Secret GitHub $name absent : le container de production ne démarrerait pas."
              exit 1
            fi
          done

      # The update sends each environment map whole:   this step owns the full env of the
      # production container, and a variable added in the Scaleway console is erased here.
      # Nécessaire pour pouvoir revenir en arrière si le smoke test échoue :
      # c'est la seule trace de "ce qui tournait avant ce déploiement".
      - name: Capture currently deployed image
        id: current
        run: |
          PREVIOUS_IMAGE=$(scw container container get ${{ secrets.SCW_CONTAINER_ID }} \
            region=${{ env.SCW_REGION }} -o json | jq -r .registry_image)
          echo "image=$PREVIOUS_IMAGE" >> "$GITHUB_OUTPUT"

      - name: Deploy serverless container
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DATABASE_USERNAME: ${{ secrets.DATABASE_USERNAME }}
          DATABASE_PASSWORD: ${{ secrets.DATABASE_PASSWORD }}
        run: |
          scw container container update ${{ secrets.SCW_CONTAINER_ID }} \
            image=${{ env.IMAGE }}:sha-${{ github.sha }} \
            environment-variables.JAVA_TOOL_OPTIONS="-XX:MaxRAMPercentage=75" \
            environment-variables.SPRING_PROFILES_ACTIVE=postgres \
            secret-environment-variables.DATABASE_URL="$DATABASE_URL" \
            secret-environment-variables.DATABASE_USERNAME="$DATABASE_USERNAME" \
            secret-environment-variables.DATABASE_PASSWORD="$DATABASE_PASSWORD" \
            region=${{ env.SCW_REGION }}

      - name: Smoke test production
        run: |
          ENDPOINT=$(scw container container get ${{ secrets.SCW_CONTAINER_ID }} \
            region=${{ env.SCW_REGION }} -o json | jq -r .public_endpoint)
          curl --fail --silent --show-error \
            --retry 12 --retry-delay 10 --retry-all-errors \
            "${ENDPOINT}${HEALTH_PATH}"
          echo "Deployed: ${ENDPOINT}${HEALTH_PATH}" >> "$GITHUB_STEP_SUMMARY"

      # Si le déploiement ou le smoke test échoue, on revient immédiatement à
      # l'image qui tournait avant ce run plutôt que de laisser une version
      # cassée en prod jusqu'à une intervention manuelle.
      - name: Rollback to previous image on failure
        if: failure() && steps.current.outcome == 'success'
        run: |
          echo "::warning::Deploy failed, rolling back to ${{ steps.current.outputs.image }}"
          scw container container update ${{ secrets.SCW_CONTAINER_ID }} \
            image=${{ steps.current.outputs.image }} \
            region=${{ env.SCW_REGION }}
          echo "### :rotating_light: Déploiement échoué — rollback vers \`${{ steps.current.outputs.image }}\`" >> "$GITHUB_STEP_SUMMARY"

  push-to-scw-pr-preview:
    needs: integration-test
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Download tested image
        uses: actions/download-artifact@v4
        with:
          name: app-image
          path: ${{ runner.temp }}

      - name: Load tested image
        run: docker load -i "$RUNNER_TEMP/book-store.tar"

      - name: Login to SCW registry
        uses: docker/login-action@v4
        with:
          registry: rg.${{ env.SCW_REGION }}.scw.cloud
          username: nologin
          password: ${{ secrets.SCW_SECRET_KEY }}

      - name: Push PR preview image
        env:
          TAG: pr-${{ github.event.pull_request.number }}
        run: |
          docker tag book-store:candidate "${{ env.IMAGE }}:${TAG}"
          docker push "${{ env.IMAGE }}:${TAG}"

  deploy-pr-preview:
    needs: push-to-scw-pr-preview
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pull-requests: write

    steps:
      - name: Set up Scaleway CLI
        uses: scaleway/action-scw@v0
        with:
          save-config: true
          export-config: true
          access-key: ${{ secrets.SCW_ACCESS_KEY }}
          secret-key: ${{ secrets.SCW_SECRET_KEY }}
          default-project-id: ${{ secrets.SCW_DEFAULT_PROJECT_ID }}
          default-organization-id: ${{ secrets.SCW_DEFAULT_ORGANIZATION_ID }}

      - name: Check preview database secrets
        env:
          PREVIEW_DATABASE_HOST: ${{ secrets.PREVIEW_DATABASE_HOST }}
          PREVIEW_DATABASE_PORT: ${{ secrets.PREVIEW_DATABASE_PORT }}
          PREVIEW_DATABASE_NAME: ${{ secrets.PREVIEW_DATABASE_NAME }}
          PREVIEW_DATABASE_USERNAME: ${{ secrets.PREVIEW_DATABASE_USERNAME }}
          PREVIEW_DATABASE_PASSWORD: ${{ secrets.PREVIEW_DATABASE_PASSWORD }}
        run: |
          for name in PREVIEW_DATABASE_HOST PREVIEW_DATABASE_PORT PREVIEW_DATABASE_NAME PREVIEW_DATABASE_USERNAME PREVIEW_DATABASE_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::Secret GitHub $name absent : la preview ne démarrerait pas."
              exit 1
            fi
          done

      # Un schéma par PR sur la base preview partagée : isole les previews entre elles
      # sans jamais toucher à la base de production (base Postgres distincte).
      - name: Provision preview schema
        env:
          SCHEMA: pr_${{ github.event.pull_request.number }}
          PGHOST: ${{ secrets.PREVIEW_DATABASE_HOST }}
          PGPORT: ${{ secrets.PREVIEW_DATABASE_PORT }}
          PGDATABASE: ${{ secrets.PREVIEW_DATABASE_NAME }}
          PGUSER: ${{ secrets.PREVIEW_DATABASE_USERNAME }}
          PGPASSWORD: ${{ secrets.PREVIEW_DATABASE_PASSWORD }}
        run: |
          psql "sslmode=require" \
            -c "CREATE SCHEMA IF NOT EXISTS \"$SCHEMA\" AUTHORIZATION \"$PGUSER\";"

      - name: Create or update preview container
        id: deploy
        env:
          TAG: pr-${{ github.event.pull_request.number }}
          CONTAINER_NAME: book-store-pr-${{ github.event.pull_request.number }}
          SCHEMA: pr_${{ github.event.pull_request.number }}
          PREVIEW_DATABASE_HOST: ${{ secrets.PREVIEW_DATABASE_HOST }}
          PREVIEW_DATABASE_PORT: ${{ secrets.PREVIEW_DATABASE_PORT }}
          PREVIEW_DATABASE_NAME: ${{ secrets.PREVIEW_DATABASE_NAME }}
          PREVIEW_DATABASE_USERNAME: ${{ secrets.PREVIEW_DATABASE_USERNAME }}
          PREVIEW_DATABASE_PASSWORD: ${{ secrets.PREVIEW_DATABASE_PASSWORD }}
        run: |
          NAMESPACE_ID=$(scw container namespace list name="${{ env.PR_PREVIEW_NAMESPACE }}" \
            region=${{ env.SCW_REGION }} -o json | jq -r '.[0].id')

          CONTAINER_ID=$(scw container container list namespace-id="$NAMESPACE_ID" \
            name="$CONTAINER_NAME" region=${{ env.SCW_REGION }} -o json | jq -r '.[0].id // empty')

          DATABASE_URL="jdbc:postgresql://${PREVIEW_DATABASE_HOST}:${PREVIEW_DATABASE_PORT}/${PREVIEW_DATABASE_NAME}?currentSchema=${SCHEMA}&sslmode=require"

          # scw remplace l'environnement du container en entier à chaque appel : le profil et
          # les identifiants DB doivent être resoumis ici à chaque déploiement, pas qu'à la création.
          if [ -z "$CONTAINER_ID" ]; then
            CONTAINER_ID=$(scw container container create \
              namespace-id="$NAMESPACE_ID" \
              name="$CONTAINER_NAME" \
              image="${{ env.IMAGE }}:${TAG}" \
              port=8080 \
              privacy=public \
              environment-variables.JAVA_TOOL_OPTIONS="-XX:MaxRAMPercentage=75" \
              environment-variables.SPRING_PROFILES_ACTIVE=postgres \
              secret-environment-variables.DATABASE_URL="$DATABASE_URL" \
              secret-environment-variables.DATABASE_USERNAME="$PREVIEW_DATABASE_USERNAME" \
              secret-environment-variables.DATABASE_PASSWORD="$PREVIEW_DATABASE_PASSWORD" \
              region=${{ env.SCW_REGION }} -o json | jq -r '.id')
          else
            scw container container update "$CONTAINER_ID" \
              image="${{ env.IMAGE }}:${TAG}" \
              environment-variables.JAVA_TOOL_OPTIONS="-XX:MaxRAMPercentage=75" \
              environment-variables.SPRING_PROFILES_ACTIVE=postgres \
              secret-environment-variables.DATABASE_URL="$DATABASE_URL" \
              secret-environment-variables.DATABASE_USERNAME="$PREVIEW_DATABASE_USERNAME" \
              secret-environment-variables.DATABASE_PASSWORD="$PREVIEW_DATABASE_PASSWORD" \
              region=${{ env.SCW_REGION }}
          fi

          PUBLIC_ENDPOINT=$(scw container container get "$CONTAINER_ID" region=${{ env.SCW_REGION }} -o json | jq -r .public_endpoint)
          echo "public_endpoint=$PUBLIC_ENDPOINT" >> "$GITHUB_OUTPUT"

      - name: Smoke test preview
        run: |
          curl --fail --silent --show-error \
            --retry 12 --retry-delay 10 --retry-all-errors \
            "${{ steps.deploy.outputs.public_endpoint }}${{ env.HEALTH_PATH }}"
          echo "Preview deployed: ${{ steps.deploy.outputs.public_endpoint }}${{ env.HEALTH_PATH }}" >> "$GITHUB_STEP_SUMMARY"

      # --edit-last + --create-if-none : un seul commentaire mis à jour à
      # chaque push, plutôt qu'un empilement d'un commentaire par déploiement.
      - name: Comment preview URL on PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr comment "${{ github.event.pull_request.number }}" \
            --repo "${{ github.repository }}" \
            --edit-last --create-if-none \
            --body "🚀 Health check : ${{ steps.deploy.outputs.public_endpoint }}${{ env.HEALTH_PATH }}"
