name: Test, build and deploy

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

# Une file d'attente par branche : les runs d'une PR s'annulent entre eux,
# ceux de master s'enchaînent pour ne jamais couper un déploiement.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  SCW_REGION: fr-par
  IMAGE: rg.fr-par.scw.cloud/book-store/springboot
  HEALTH_PATH: /api/health
  PR_PREVIEW_NAMESPACE: book-store-pr-preview

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Set up Gradle (cache + wrapper validation)
        uses: gradle/actions/setup-gradle@v4

      # Trois couches, de la moins chère à la plus chère.
      - name: Unit tests
        run: ./gradlew :book-store:test

      - name: Build jar
        run: ./gradlew :book-store:bootJar

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: book-store/build/reports/tests

      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: app-jar
          path: book-store/build/libs/app.jar
          retention-days: 1

  # Sur chaque PR et chaque push : l'image candidate est testée en boîte noire
  # juste après les TU, sans secret ni registry.
  integration-test:
    needs: build-and-test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Download tested jar
        uses: actions/download-artifact@v4
        with:
          name: app-jar
          path: book-store/build/libs

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}

      - name: Build image (local)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile
          load: true
          push: false
          labels: ${{ steps.meta.outputs.labels }}
          tags: book-store:candidate
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Start the candidate image
        run: APP_IMAGE=book-store:candidate docker compose up -d

      - name: Integration tests (black box)
        run: ./gradlew :book-store-ti:integrationTest

      - name: Container logs
        if: failure()
        run: docker compose logs --no-color app

      - name: Tear down
        if: always()
        run: docker compose down -v

      # On transmet l'image testée, pas un rebuild : ce qui part en prod (ou en
      # preview de PR) est exactement ce que les TI ont validé.
      - name: Export tested image
        if: (github.event_name == 'push' && github.ref == 'refs/heads/master') || github.event_name == 'pull_request'
        run: docker save book-store:candidate -o "$RUNNER_TEMP/book-store.tar"

      - name: Upload tested image
        if: (github.event_name == 'push' && github.ref == 'refs/heads/master') || github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: app-image
          path: ${{ runner.temp }}/book-store.tar
          retention-days: 1

  push-to-scw-registery:
    needs: integration-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest

    steps:
      - name: Download tested image
        uses: actions/download-artifact@v4
        with:
          name: app-image
          path: ${{ runner.temp }}

      - name: Load tested image
        run: docker load -i "$RUNNER_TEMP/book-store.tar"

      - name: Login to SCW registry
        uses: docker/login-action@v4
        with:
          registry: rg.${{ env.SCW_REGION }}.scw.cloud
          username: nologin
          password: ${{ secrets.SCW_SECRET_KEY }}

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest
            type=sha,format=long

      - name: Push tested image
        id: push
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          while read -r tag; do
            docker tag book-store:candidate "$tag"
            docker push "$tag"
          done <<< "$TAGS"
          echo "digest=$(docker inspect --format '{{index .RepoDigests 0}}' book-store:candidate)" >> "$GITHUB_OUTPUT"

      - name: Summary
        run: |
          {
            echo "### Image pushed"
            echo "- Tags: \`${{ steps.meta.outputs.tags }}\`"
            echo "- Digest: \`${{ steps.push.outputs.digest }}\`"
          } >> "$GITHUB_STEP_SUMMARY"

  deploy:
    needs: push-to-scw-registery
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Set up Scaleway CLI
        uses: scaleway/action-scw@v0
        with:
          save-config: true
          export-config: true
          access-key: ${{ secrets.SCW_ACCESS_KEY }}
          secret-key: ${{ secrets.SCW_SECRET_KEY }}
          default-project-id: ${{ secrets.SCW_DEFAULT_PROJECT_ID }}
          default-organization-id: ${{ secrets.SCW_DEFAULT_ORGANIZATION_ID }}

      - name: Deploy serverless container
        run: |
          scw container container update ${{ secrets.SCW_CONTAINER_ID }} \
            image=${{ env.IMAGE }}:sha-${{ github.sha }} \
            region=${{ env.SCW_REGION }}
          scw container container deploy ${{ secrets.SCW_CONTAINER_ID }} \
            region=${{ env.SCW_REGION }}

      - name: Smoke test production
        run: |
          DOMAIN=$(scw container container get ${{ secrets.SCW_CONTAINER_ID }} \
            region=${{ env.SCW_REGION }} -o json | jq -r .domain_name)
          curl --fail --silent --show-error \
            --retry 12 --retry-delay 10 --retry-all-errors \
            "https://${DOMAIN}${HEALTH_PATH}"
          echo "Deployed: https://${DOMAIN}${HEALTH_PATH}" >> "$GITHUB_STEP_SUMMARY"

  # Sur chaque push vers une branche de PR : l'image testée part vers un tag
  # dédié à la PR, pour alimenter le déploiement de preview.
  push-to-scw-pr-preview:
    needs: integration-test
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest

    steps:
      - name: Download tested image
        uses: actions/download-artifact@v4
        with:
          name: app-image
          path: ${{ runner.temp }}

      - name: Load tested image
        run: docker load -i "$RUNNER_TEMP/book-store.tar"

      - name: Login to SCW registry
        uses: docker/login-action@v4
        with:
          registry: rg.${{ env.SCW_REGION }}.scw.cloud
          username: nologin
          password: ${{ secrets.SCW_SECRET_KEY }}

      - name: Push PR preview image
        env:
          TAG: pr-${{ github.event.pull_request.number }}
        run: |
          docker tag book-store:candidate "${{ env.IMAGE }}:${TAG}"
          docker push "${{ env.IMAGE }}:${TAG}"

  # Un container par PR dans le namespace de preview (book-store-pr-preview) :
  # créé au premier push, mis à jour et redéployé à chaque push suivant.
  deploy-pr-preview:
    needs: push-to-scw-pr-preview
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write

    steps:
      - name: Set up Scaleway CLI
        uses: scaleway/action-scw@v0
        with:
          save-config: true
          export-config: true
          access-key: ${{ secrets.SCW_ACCESS_KEY }}
          secret-key: ${{ secrets.SCW_SECRET_KEY }}
          default-project-id: ${{ secrets.SCW_DEFAULT_PROJECT_ID }}
          default-organization-id: ${{ secrets.SCW_DEFAULT_ORGANIZATION_ID }}

      - name: Create or update preview container
        id: deploy
        env:
          TAG: pr-${{ github.event.pull_request.number }}
          CONTAINER_NAME: book-store-pr-${{ github.event.pull_request.number }}
        run: |
          NAMESPACE_ID=$(scw container namespace list name="${{ env.PR_PREVIEW_NAMESPACE }}" \
            region=${{ env.SCW_REGION }} -o json | jq -r '.[0].id')

          CONTAINER_ID=$(scw container container list namespace-id="$NAMESPACE_ID" \
            name="$CONTAINER_NAME" region=${{ env.SCW_REGION }} -o json | jq -r '.[0].id // empty')

          if [ -z "$CONTAINER_ID" ]; then
            CONTAINER_ID=$(scw container container create \
              namespace-id="$NAMESPACE_ID" \
              name="$CONTAINER_NAME" \
              image="${{ env.IMAGE }}:${TAG}" \
              port=8080 \
              privacy=public \
              environment-variables.JAVA_TOOL_OPTIONS="-XX:MaxRAMPercentage=75" \
              region=${{ env.SCW_REGION }} -o json | jq -r '.id')
          else
            scw container container update "$CONTAINER_ID" \
              image="${{ env.IMAGE }}:${TAG}" \
              region=${{ env.SCW_REGION }}
          fi

          
          PUBLIC_ENDPOINT=$(scw container container get "$CONTAINER_ID" region=${{ env.SCW_REGION }} -o json | jq -r .public_endpoint)
          echo "public_endpoint=$PUBLIC_ENDPOINT" >> "$GITHUB_OUTPUT"

      - name: Smoke test preview
        run: |
          curl --fail --silent --show-error \
            --retry 12 --retry-delay 10 --retry-all-errors \
            "${{ steps.deploy.outputs.public_endpoint }}${{ env.HEALTH_PATH }}"
          echo "Preview deployed: ${{ steps.deploy.outputs.public_endpoint }}${{ env.HEALTH_PATH }}" >> "$GITHUB_STEP_SUMMARY"

      # --edit-last + --create-if-none : un seul commentaire mis à jour à
      # chaque push, plutôt qu'un empilement d'un commentaire par déploiement.
      - name: Comment preview URL on PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr comment "${{ github.event.pull_request.number }}" \
            --repo "${{ github.repository }}" \
            --edit-last --create-if-none \
            --body "🚀 Preview déployée : ${{ steps.deploy.outputs.public_endpoint }}
          Health check : ${{ steps.deploy.outputs.public_endpoint }}${{ env.HEALTH_PATH }}"
