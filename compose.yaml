services:
  app:
    image: ${APP_IMAGE:-book-store:candidate}
    build:
      context: .
      dockerfile: docker/Dockerfile
    ports:
      - "8080:8080"
    environment:
      JAVA_TOOL_OPTIONS: "-XX:MaxRAMPercentage=75"
    mem_limit: 512m
    volumes:
      - book-store-data:/app/data

volumes:
  book-store-data:
